<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MyMoney</title>
    <script>
      // GitHub Pages has no server-side router, so it 404s on any deep link
      // (e.g. /mymoney/history) that isn't a real file. This encodes the
      // path into a query string and redirects to index.html, where the
      // inline script there decodes it back so React Router sees the
      // original URL. pathSegmentsToKeep = 1 to preserve the /mymoney/
      // project-pages segment. Canonical trick: rafgraham/spa-github-pages.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
