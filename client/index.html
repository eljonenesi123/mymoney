<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2C3E4C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyMoney" />
    <meta name="description" content="Track spending and scan receipts on the go." />
    <title>MyMoney</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Applies the saved theme before React mounts/paints, so switching
         between light and dark doesn't flash the wrong one on load. -->
    <script>
      try {
        var theme = localStorage.getItem('expense-tracker:theme');
        if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
    <!-- Decodes the redirect from 404.html back into a real URL before the
         app mounts, so React Router sees the original deep link. No-op
         locally and on hosts with real server-side routing. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
